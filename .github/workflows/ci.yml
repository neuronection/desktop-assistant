name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verification gate (lint + typecheck + test + build)
        run: npm run verify

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install xvfb (headless X for the Electron smoke)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Playwright E2E smoke over the demo harness
        run: xvfb-run -a npm run smoke:e2e

  # Ecosystem README sync drift is checked locally, not in CI: the canonical
  # content lives in the private org `.github` repo, which a workflow cannot
  # fetch anonymously. Run `python3 scripts/sync_ecosystem.py` before release
  # commits (it auto-detects the sibling dev-repo checkout as the source).
